server {
    listen 80;

    # 1. Les fichiers statiques du frontend React
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.htni;
    }

    # 2. Les appels API → transmis au backend
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. Les liens courts (ex: /H8yIuw) → transmis au backend
    location ~ "^/[a-zA-Z0-9_-]{4,10}$" {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}